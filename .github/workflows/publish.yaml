name: Publish DevBox-C

on:
  push:
    tags:
      - 'v*' # Parse tag name, ex: v1.1, v1.2.3
  workflow_dispatch: # Manually trigger workflow from GitHub UI
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        # lite: dev envir. only
        # full: dev envir. + debug tools
        variant: [lite, full]
        include:
          - variant: lite
            debug_flag: "false"
          - variant: full
            debug_flag: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup QEMU for raspberry pi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # PATH of dockerfile
          context: .
          file: ./docker_envir/Dockerfile_multiplatform
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INSTALL_DEBUG=${{ matrix.debug_flag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.variant }}